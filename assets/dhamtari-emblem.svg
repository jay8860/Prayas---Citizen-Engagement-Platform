<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="faceGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FDF9EE" />
      <stop offset="100%" stop-color="#F1E7CC" />
    </radialGradient>
  </defs>

  <!-- outer rings -->
  <circle cx="150" cy="150" r="146" fill="#0E2E5C" />
  <circle cx="150" cy="150" r="146" fill="none" stroke="#C8A96A" stroke-width="3" />
  <circle cx="150" cy="150" r="132" fill="none" stroke="#C8A96A" stroke-width="1.5" />
  <circle cx="150" cy="150" r="118" fill="url(#faceGrad)" stroke="#8B6A2F" stroke-width="2.5" />
  <circle cx="150" cy="150" r="108" fill="none" stroke="#8B6A2F" stroke-width="1" />

  <!-- header / footer text (set on the navy ring, straight for reliable rendering) -->
  <text x="150" y="21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#F4E9CC">ZILA PANCHAYAT DHAMTARI</text>
  <text x="150" y="284" text-anchor="middle" font-family="Lohit Devanagari, Noto Sans Devanagari, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.4" fill="#F4E9CC">छत्तीसगढ़ शासन</text>

  <!-- small ornamental dots -->
  <circle cx="150" cy="34" r="2.4" fill="#C8A96A" />
  <circle cx="150" cy="266" r="2.4" fill="#C8A96A" />

  <!-- Ashoka-chakra-style motif (generic stylised wheel, not an official reproduction) -->
  <g transform="translate(150,150)">
    <circle r="58" fill="none" stroke="#0E2E5C" stroke-width="3.5" />
    <circle r="6.5" fill="#0E2E5C" />
    <g stroke="#0E2E5C" stroke-width="2.6">
      <!-- 24 spokes -->
      <line x1="0" y1="-58" x2="0" y2="-9" />
      <line x1="0" y1="58" x2="0" y2="9" />
      <line x1="58" y1="0" x2="9" y2="0" />
      <line x1="-58" y1="0" x2="-9" y2="0" />
      <line x1="41" y1="-41" x2="6.4" y2="-6.4" />
      <line x1="-41" y1="-41" x2="-6.4" y2="-6.4" />
      <line x1="41" y1="41" x2="6.4" y2="6.4" />
      <line x1="-41" y1="41" x2="-6.4" y2="6.4" />
      <line x1="22.2" y1="-53.8" x2="3.5" y2="-8.5" />
      <line x1="-22.2" y1="-53.8" x2="-3.5" y2="-8.5" />
      <line x1="22.2" y1="53.8" x2="3.5" y2="8.5" />
      <line x1="-22.2" y1="53.8" x2="-3.5" y2="8.5" />
      <line x1="53.8" y1="-22.2" x2="8.5" y2="-3.5" />
      <line x1="53.8" y1="22.2" x2="8.5" y2="3.5" />
      <line x1="-53.8" y1="-22.2" x2="-8.5" y2="-3.5" />
      <line x1="-53.8" y1="22.2" x2="-8.5" y2="3.5" />
      <line x1="50.9" y1="-31.3" x2="8" y2="-4.9" />
      <line x1="50.9" y1="31.3" x2="8" y2="4.9" />
      <line x1="-50.9" y1="-31.3" x2="-8" y2="-4.9" />
      <line x1="-50.9" y1="31.3" x2="-8" y2="4.9" />
      <line x1="31.3" y1="-50.9" x2="4.9" y2="-8" />
      <line x1="-31.3" y1="-50.9" x2="-4.9" y2="-8" />
      <line x1="31.3" y1="50.9" x2="4.9" y2="8" />
      <line x1="-31.3" y1="50.9" x2="-4.9" y2="8" />
    </g>
    <!-- laurel-style flanking sprigs -->
    <g stroke="#8B6A2F" stroke-width="2" fill="none" opacity="0.85">
      <path d="M -78 30 Q -92 0 -78 -30" />
      <path d="M 78 30 Q 92 0 78 -30" />
      <path d="M -78 -22 l -8 -4 M -80 -8 l -9 -2 M -80 6 l -9 2 M -78 20 l -8 4" />
      <path d="M 78 -22 l 8 -4 M 80 -8 l 9 -2 M 80 6 l 9 2 M 78 20 l 8 4" />
    </g>
  </g>

  <!-- inner banner ribbon at base holding "ESTD" style micro text -->
  <g transform="translate(150,213)">
    <rect x="-46" y="-11" width="92" height="20" rx="4" fill="#0E2E5C" opacity="0.9" />
    <text x="0" y="3" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#F4E9CC">GOVT. OF C.G.</text>
  </g>
</svg>
